service: lawai-backend-2025

frameworkVersion: '^4.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 29
  memorySize: 1024

  environment:
    S3_BUCKET: contractfiles1
    S3_BUCKET_NAME: contractfiles1
    COGNITO_USER_POOL_ID: us-east-1_aIKpGUemJ
    COGNITO_CLIENT_ID: 35lg87vkonlnk8n8rk1levbs5b
    COGNITO_CLIENT_SECRET: 14mdgpnodi63436nnmdm8l6cl5mp5g468mcvtllh03v09sqre7mv

  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
        - s3:ListObjectsV2
      Resource:
        - "arn:aws:s3:::contractfiles1"
        - "arn:aws:s3:::contractfiles1/*"
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminConfirmSignUp
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:ListUsers
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminDeleteUser
      Resource:
        - "arn:aws:cognito-idp:us-east-1:*:userpool/us-east-1_aIKpGUemJ"

functions:
  lawAiBackend:
    handler: lambda-auth.handler
    name: ${self:provider.stage}-lawai-backend-2025
    layers:
      - {Ref: AwsSdkLayerLambdaLayer}
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /
          method: ANY
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

layers:
  awsSdkLayer:
    path: lambda-layer
    name: ${self:provider.stage}-aws-sdk-layer
    description: AWS SDK dependencies for Lambda
    compatibleRuntimes:
      - nodejs20.x

package:
  exclude:
    - '**'
  include:
    - lambda-auth.js
    - auth-handlers.js
    - s3-operations.js
    - helpers.js
    - aws-clients.js
  excludeDevDependencies: true
  individually: false
