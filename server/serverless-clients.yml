service: law-ai-clients-prod

frameworkVersion: '^4.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 512

  environment:
    S3_BUCKET: contractfiles1
    S3_BUCKET_NAME: contractfiles1

  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
        - s3:ListBucket
        - s3:ListObjectsV2
        - s3:HeadObject
      Resource:
        - "arn:aws:s3:::contractfiles1"
        - "arn:aws:s3:::contractfiles1/*"

functions:
  lawAiClients:
    handler: lambda-clients.handler
    name: ${self:provider.stage}-law-ai-clients
    events:
      - http:
          path: /clients
          method: GET
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients
          method: POST
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients/{id}
          method: GET
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients/{id}
          method: PUT
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients/{id}
          method: DELETE
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients/{id}/documents
          method: GET
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /clients/{id}/documents
          method: POST
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - Accept
              - X-Amz-Date
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

package:
  patterns:
    - lambda-clients.js
    - helpers.js
    - s3-operations.js
    - node_modules/@aws-sdk/client-s3/**
    - node_modules/@aws-sdk/lib-dynamodb/**
    - node_modules/@aws-sdk/util-dynamodb/**
    - '!node_modules/**'